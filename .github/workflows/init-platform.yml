name: Initialiser les dossiers de plateforme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer les dossiers de plateforme
        run: flutter create --platforms=web,android --project-name smarttools --org com.smartlifeapps .
      - name: Autoriser la vibration (Android)
        run: sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android web
          git commit -m "Ajout des dossiers android et web" || echo "Rien à enregistrer"
          git push
