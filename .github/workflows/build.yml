name: Build SmartTools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smarttools-build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer les dossiers de plateforme
        run: flutter create --platforms=web,android --project-name smarttools --org com.smartlifeapps .
      - run: flutter pub get
      - name: Analyse du code
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter build web --release --base-href "/smarttools/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer les dossiers de plateforme
        run: flutter create --platforms=web,android --project-name smarttools --org com.smartlifeapps .
      - name: Autoriser la vibration (Android)
        run: sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smarttools-apk
          path: build/app/outputs/flutter-apk/app-release.apk
