name: Corriger le nom de l'application

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remplacer le nom
        run: |
          sed -i 's/android:label="smarttools"/android:label="SmartTools"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<title>smarttools</title>#<title>SmartTools</title>#' web/index.html
          sed -i 's/content="smarttools"/content="SmartTools"/' web/index.html
          sed -i 's/"smarttools"/"SmartTools"/g' web/manifest.json
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android web
          git commit -m "Nom de l'application : SmartTools" || echo "Rien à enregistrer"
          git push
